name: custom-voice
version: 0.2.1
manifest_version: 2
description: "STT + TTS through direct Google/Groq key rotation or any OpenAI-compatible speech endpoint."
author: Suzan
license: MIT
tags: [speech, tts, stt, voice]

config_schema:
  tts_model:
    type: str
    label: "TTS Model"
    description: "Gemini TTS model or endpoint model"
    choices:
      - "gemini-3.8-flash-lite-tts"
      - "gemini-3.8-flash-tts"
      - "gemini-2.5-flash-preview-tts"
      - "gemini-2.5-pro-preview-tts"
  tts_voice:
    type: str
    label: "TTS Voice"
    description: "Voice name for speech generation"
    choices:
      - "Autonoe"
      - "Kore"
      - "Puck"
      - "Zephyr"
      - "Fenrir"
      - "Aoede"
      - "Leda"
      - "Callirrhoe"
      - "Charon"
      - "Orus"
      - "Enceladus"
      - "Iapetus"
      - "Umbriel"
      - "Algieba"
      - "Despina"
      - "Erinome"
  stt_model:
    type: str
    label: "STT Model"
    description: "Whisper model for speech-to-text"
    choices:
      - "whisper-large-v3"
      - "whisper-large-v3-turbo"
  keys_file:
    type: str
    label: "Keys YAML File"
    description: "Path to multi-key YAML file for direct rotation"
  key_status_overview:
    type: str
    label: "Active Keys Status"
    description: "Status snapshot. Run /voice-status in chat for a live per-key probe table."
  gateway_url:
    type: str
    label: "Gateway URL (Optional)"
    description: "OpenAI-compatible speech endpoint URL if not using direct keys file"
